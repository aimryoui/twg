name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Tag and Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VER=$(grep -oP '^## \[\K[^\]]+' CHANGELOG.md | grep -v 'Unreleased' | head -n 1)

          if ! git rev-parse "v$LATEST_VER" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$LATEST_VER" -m "Release v$LATEST_VER"
            git push origin "v$LATEST_VER"
          fi

          VERSIONS=$(grep -oP '^## \[\K[^\]]+' CHANGELOG.md | grep -v 'Unreleased')

          for ver in $VERSIONS; do
            tag="v$ver"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              sed -n "/^## \[$ver\]/,/^## \[/p" CHANGELOG.md | grep -v '^## \[' | sed '/^\[.*\]:/Q' > notes.md
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release edit "$tag" --notes-file notes.md
              else
                gh release create "$tag" --title "$tag" --notes-file notes.md
              fi
            fi
          done
